[project]
name = "openai-compatible-bridge"
version = "0.1.0"
description = "Multi-protocol gateway for AI model APIs across providers"
requires-python = ">=3.11"
dependencies = [
    "cachetools>=5.5,<8",
    "fastapi>=0.133.0",
    "google-auth>=2.55.0",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic>=2.13.0",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.41.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "openai>=2.41.0",
    "pytest>=9.0.3",
]
