  <rect x="1" y="1" width="1198" height="238" rx="22" fill="url(#bg)" stroke="#45475a" stroke-width="1"/>
  <rect x="32" y="30" width="1136" height="5" rx="2.5" fill="url(#stripe)"/>

  <text x="600" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="50" font-weight="700" text-anchor="middle">
    <tspan fill="#cdd6f4">AI Model </tspan><tspan fill="#89b4fa">Interop</tspan>
  </text>
  <text x="600" y="150" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" fill="#a6adc8" text-anchor="middle">Multi-protocol AI model APIs &#183; provider-native routing &#183; private / local-only</text>

  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="600" text-anchor="middle">
    <rect x="270" y="180" width="160" height="32" rx="16" fill="#313244" stroke="#f5e0dc" stroke-width="1.4"/>
