    <line x1="438" y1="196" x2="468" y2="196" stroke="#6c7086" stroke-width="1.6" marker-end="url(#tip)"/>

    <rect x="476" y="180" width="140" height="32" rx="16" fill="#313244" stroke="#89b4fa" stroke-width="1.4"/>
